<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventide | Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="sidebar-root"></div>

    <main class="page-content">
        <section id="dashboard" class="dashboard-section">
            <div class="container">
                <div class="dashboard-header">
                    <div>
                        <h2>Dashboard</h2>
                        <p class="section-subtitle">Live pulse of your inventory</p>
                    </div>
                </div>

                <div class="cards-grid">
                    <div class="stat-card">
                        <div class="stat-label">Total Items</div>
                        <div class="stat-value" id="stat-total-items">--</div>
                    </div>
                    <div class="stat-card warning">
                        <div class="stat-label">Below Minimum</div>
                        <div class="stat-value" id="stat-below-min">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Warehouses</div>
                        <div class="stat-value" id="stat-warehouses">--</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Last Update</div>
                        <div class="stat-value dashboard-date" id="stat-last-update">--</div>
                    </div>
                </div>

                <div class="dashboard-split">
                    <div class="panel">
                        <div class="panel-header">
                            <h3>Recent Stock Changes</h3>
                            <span class="pill">Last 5</span>
                        </div>
                        <div id="recent-events" class="events-container">
                            <p class="loading">Loading recent activity...</p>
                        </div>
                    </div>

                    <div class="panel">
                        <div class="panel-header">
                            <h3>Low Stock</h3>
                            <span class="pill warning">Below min</span>
                        </div>
                        <div id="low-stock" class="low-stock-list">
                            <p class="loading">Loading low stock...</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Eventide. All rights reserved.</p>
        </div>
    </footer>

    <script src="shared/sidebar.js"></script>
    <script src="script.js"></script>
</body>
</html>
