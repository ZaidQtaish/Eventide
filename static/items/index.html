<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventide | Items</title>
    <link rel="stylesheet" href="../style.css" />
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container">
            <a href="/"><div class="logo">Eventide</div></a>
            <ul class="nav-links">
                <li><a href="/">Dashboard</a></li>
                <li><a href="/items/">Items</a></li>
                <li><a href="/inventory/">Inventory</a></li>
                <li><a href="/events/">Events</a></li>
                <li><a href="/logout">Logout</a></li>
            </ul>
        </div>
    </nav>

    <main class="page-content">
        <section class="dashboard-section">
            <div class="container">
                <div class="dashboard-header">
                    <div>
                        <h2>Manage Items</h2>
                        <p class="section-subtitle">Catalog of all inventory items</p>
                    </div>
                    <div class="dashboard-header-actions">
                        <button id="add-new-item-btn" class="cta-btn primary" type="button">Create New Item</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <h3>Filtering</h3>
                    </div>
                    <div class="filter-row filters-with-clear">
                        <input id="item-search-filter" class="form-control" type="search" placeholder="Search by item name, SKU" />
                        <div class="filters-clear">
                            <button id="clear-filter" class="cta-btn ghost">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="panel" style="margin-bottom: 20px;">
                    <div class="panel-header">
                        <h3>Items</h3>
                        <span class="pill">Catalog</span>
                    </div>
                    <div id="items-list" class="events-container">
                        <p class="loading">Loading items...</p>
                    </div>
                    <div class="pagination-bar">
                        <button id="items-prev-page" class="cta-btn ghost pagination-btn" type="button">Prev</button>
                        <span id="items-page-info" class="pagination-info">Page 1 of 1</span>
                        <button id="items-next-page" class="cta-btn ghost pagination-btn" type="button">Next</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Eventide. All rights reserved.</p>
        </div>
    </footer>
    <script src="items.js"></script>
</body>

</html>
