<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventide | Items</title>
    <link rel="stylesheet" href="../style.css" />
</head>

<body>
    <div id="sidebar-root"></div>

    <main class="page-content">
        <section class="dashboard-section">
            <div class="container">
                <div class="dashboard-header">
                    <div>
                        <h2>Manage Items</h2>
                        <p class="section-subtitle">Catalog of all inventory items</p>
                    </div>
                    <div class="dashboard-header-actions">
                        <button id="add-new-item-btn" class="cta-btn primary" type="button">Add New Item</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-header">
                        <h3>Filtering</h3>
                    </div>
                    <div class="filter-row filters-with-clear">
                        <input id="item-search-filter" class="form-control" type="search" placeholder="Search by item name, SKU" />
                        <select id="item-category-filter" class="form-control" aria-label="Filter by category">
                            <option value="">All categories</option>
                        </select>
                        <div class="filters-clear">
                            <button id="clear-filter" class="cta-btn ghost">Clear</button>
                        </div>
                    </div>
                </div>

                <div class="panel" style="margin-bottom: 20px;">
                    <div class="panel-header">
                        <h3>Items</h3>
                        <div class="panel-header-badges">
                            <span class="pill">Catalog</span>
                            <button id="export-items-csv" class="cta-btn ghost panel-badge-btn" type="button">Export CSV</button>
                        </div>
                    </div>
                    <div id="items-list" class="events-container">
                        <p class="loading">Loading items...</p>
                    </div>
                    <div class="pagination-bar">
                        <button id="items-prev-page" class="cta-btn ghost pagination-btn" type="button">Prev</button>
                        <span id="items-page-info" class="pagination-info">Page 1 of 1</span>
                        <button id="items-next-page" class="cta-btn ghost pagination-btn" type="button">Next</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="create-item-modal" class="event-modal is-hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="create-item-title">
        <div class="event-modal-backdrop" data-close-item-modal="true"></div>
        <div class="event-modal-card panel">
            <div class="panel-header">
                <h3 id="create-item-title">Add New Item</h3>
                <button id="close-create-item-modal" class="cta-btn ghost event-modal-close" type="button">Close</button>
            </div>

            <form id="create-item-form" class="event-form-grid" novalidate>
                <div class="form-group">
                    <label for="item-name">Name</label>
                    <input id="item-name" class="form-control" type="text" required maxlength="100" />
                </div>

                <div class="form-group">
                    <label for="item-sku">SKU</label>
                    <input id="item-sku" class="form-control" type="text" required maxlength="50" />
                </div>

                <div class="form-group">
                    <label for="item-category">Category</label>
                    <select id="item-category" class="form-control">
                        <option value="">Select category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Cables">Cables</option>
                        <option value="Office">Office</option>
                        <option value="Supplies">Supplies</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="item-minimum-stock">Minimum Stock</label>
                    <input id="item-minimum-stock" class="form-control" type="number" min="0" step="1" value="10" required />
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="item-description">Description</label>
                    <textarea id="item-description" class="form-control" rows="3" maxlength="1000"></textarea>
                </div>

                <div class="form-group" style="grid-column: 1 / -1;">
                    <label for="item-supplier-id">Supplier ID (optional)</label>
                    <input id="item-supplier-id" class="form-control" type="number" min="1" step="1" />
                </div>

                <p id="create-item-message" class="form-message" aria-live="polite"></p>

                <div class="event-form-actions">
                    <button id="create-item-submit" class="cta-btn primary" type="submit">Create Item</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Eventide. All rights reserved.</p>
        </div>
    </footer>
    <script src="../shared/sidebar.js"></script>
    <script src="../shared/export-utils.js"></script>
    <script src="item-modal.js"></script>
    <script src="items.js"></script>
</body>

</html>
